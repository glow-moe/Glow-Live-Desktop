# Builds the Linux and Windows binaries for a tag the same way the README does
# and stores them as a workflow artifact. It does NOT create the release: the
# maintainer's release script downloads the artifact, signs the Windows binary
# with Azure Trusted Signing, writes SHA256SUMS for the in-app updater and
# publishes the GitHub release from the maintainer's own account.
#
# Trigger: push a tag (v26.6) or run it by hand with the tag as input. The tag
# must match the VERSION file.
#
# Secrets: APP_GLOW, APP_LOL, APP_FH6, APP_FH5, APP_SPLITCRAFT (Discord application ids, kept
# out of the tree).
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v26.6 (must match VERSION)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      P: github.com/glow-moe/glow-collector/internal/orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="$(cat VERSION | tr -d '[:space:]')"
          if [ "$TAG" != "v$VER" ]; then
            echo "tag $TAG does not match VERSION $VER" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build Linux
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APP_GLOW: ${{ secrets.APP_GLOW }}
          APP_LOL: ${{ secrets.APP_LOL }}
          APP_FH6: ${{ secrets.APP_FH6 }}
          APP_FH5: ${{ secrets.APP_FH5 }}
          APP_SPLITCRAFT: ${{ secrets.APP_SPLITCRAFT }}
        run: |
          mkdir -p dist
          PKG_CONFIG_PATH="$PWD/.pkgconfig-shim:$PKG_CONFIG_PATH" CGO_ENABLED=1 \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG \
              -X $P.appGlow=$APP_GLOW -X $P.appLoL=$APP_LOL \
              -X $P.appForzaH6=$APP_FH6 -X $P.appForzaH5=$APP_FH5 \
              -X $P.appSplitcraft=$APP_SPLITCRAFT" \
            -o dist/glow-live-linux-x64 ./cmd/gui

      - name: Build Windows (cross)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APP_GLOW: ${{ secrets.APP_GLOW }}
          APP_LOL: ${{ secrets.APP_LOL }}
          APP_FH6: ${{ secrets.APP_FH6 }}
          APP_FH5: ${{ secrets.APP_FH5 }}
          APP_SPLITCRAFT: ${{ secrets.APP_SPLITCRAFT }}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ \
            CGO_CXXFLAGS="-I$PWD/.winshim" CGO_CPPFLAGS="-I$PWD/.winshim" \
            go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$TAG \
              -X $P.appGlow=$APP_GLOW -X $P.appLoL=$APP_LOL \
              -X $P.appForzaH6=$APP_FH6 -X $P.appForzaH5=$APP_FH5 \
              -X $P.appSplitcraft=$APP_SPLITCRAFT" \
            -o dist/glow-live-windows-x64.exe ./cmd/gui

      - name: Checksums of the unsigned builds (for the log)
        run: cd dist && sha256sum glow-live-linux-x64 glow-live-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
